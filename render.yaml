# Gratis testmiljö på Render (Frankfurt). Databasen ligger hos Neon (Frankfurt).
# Bara påhittade testdata: inga riktiga hyresgäster eller personnummer här.
# Se deploy/TESTMILJO.md.
services:
  - type: web
    name: fastighetssystem-test
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npx --yes pnpm@10.28.0 install --frozen-lockfile && npx --yes pnpm@10.28.0 build
    startCommand: bash deploy/start.sh
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: COOKIE_SECURE
        value: "true"
      # "true" fyller en tom databas med påhittade demodata vid start. Avstängt: testmiljön börjar tom.
      - key: DEMO_DATA
        value: "false"
      # "true" fyller i påhittade bankgiron, momsnr och adresser på bolag där de saknas (skriver aldrig över).
      # Bara för testmiljön, aldrig i produktion.
      - key: TEST_COMPANY_DATA
        value: "true"
      # Nyckel som krypterar hemligheterna för tvåstegsverifiering. Render skapar den själv en gång.
      # Byt den aldrig: då måste alla sätta upp tvåstegsverifiering på nytt.
      - key: AUTH_SECRET
        generateValue: true
      # Adressen som används i länkar i e-post (inbjudan, nytt lösenord).
      - key: APP_URL
        value: https://fastighetssystem-test.onrender.com
      # Fylls i när tjänsten skapas: anslutningsadressen från Neon.
      - key: DATABASE_URL
        sync: false
      # Fylls i när tjänsten skapas: lösenordet för admin@example.se i testmiljön.
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # E-post i testmiljön skickas bara till adresserna i EMAIL_ALLOWLIST. Andra mottagare blir testläge.
      - key: EMAIL_ALLOWLIST_ONLY
        value: "true"
      # Läggs in under Environment i Render (se deploy/TESTMILJO.md). Klistra aldrig in nycklar i chatten.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: EMAIL_ALLOWLIST
        sync: false
      # SMS till hyresgäster (Utskick). SMS_PROVIDER = brevo eller 46elks. Utan den körs SMS i testläge.
      - key: SMS_PROVIDER
        sync: false
      - key: SMS_FROM
        sync: false
      - key: SMS_ALLOWLIST
        sync: false
      - key: ELKS_API_USERNAME
        sync: false
      - key: ELKS_API_PASSWORD
        sync: false
      # Krypterar bankens SSH-nyckel i databasen (automatisk hämtning av inbetalningar).
      # Render skapar ett slumpvärde. Byts det måste en ny nyckel skickas till banken.
      - key: APP_SECRET_KEY
        generateValue: true
      # Länk i e-postbesked om inbetalningar att hantera
      - key: PUBLIC_URL
        value: https://fastighetssystem-test.onrender.com
